version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sensoria
      POSTGRES_PASSWORD: sensoria
      POSTGRES_DB: sensoria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: